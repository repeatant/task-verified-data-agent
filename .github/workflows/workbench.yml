name: Workbench
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: python tools/start_workbench.py --prepare-only
      - run: .venv-workbench/bin/python -m pytest -q tests -k workbench
      - name: Exercise workbench in Chrome
        run: |
          .venv-workbench/bin/python -m dataverify.workbench > "$RUNNER_TEMP/workbench.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8765/api/workbench/config > /dev/null
          pnpm --dir frontend run test:e2e
